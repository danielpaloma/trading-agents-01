# Trading Logic:
# The Contrarian strategy seeks to profit by trading against recent short-term price momentum.
# - It calculates the price change over a moving window of 'window' historical bars.
# - If prices have trended upward over the window,
#  the strategy assumes the move is over-extended, so it enters a short position.
# - If prices have fallen over the window, the strategy takes a long position.
# - The magnitude of the position is fixed by the 'units' parameter specified below.
#
# Parameters:
# - window: The lookback window (in bars) to measure recent momentum.
# Larger values = longer-term mean reversion, smaller values = faster, more reactive.
# - units: The number of contract/asset units to buy or sell when a contrarian signal is triggered.


window: 10
units: 10
